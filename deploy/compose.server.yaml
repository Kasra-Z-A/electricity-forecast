services:
  batch:
    image: ${POWER_IMAGE:?POWER_IMAGE must be set to a pinned ECR digest}
    env_file: /run/power-forecast.env
    volumes:
      - /var/lib/power-forecast:/app/data
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
