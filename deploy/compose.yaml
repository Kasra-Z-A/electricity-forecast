services:
  dashboard:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../data/dashboard:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "${POWER_UID:-1000}:${POWER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  batch:
    build:
      context: ..
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    user: "${POWER_UID:-1000}:${POWER_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
