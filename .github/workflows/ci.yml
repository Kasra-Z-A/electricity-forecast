name: checks

# Tests run on every push and pull request. Pushes to main also build the
# application image once and push it to ECR, so the image that reaches the
# forecasting host is the one CI tested. The host pulls a pinned digest; it no
# longer builds anything itself.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      # Tests need the research group; the image never installs it.
      - run: uv sync --locked --python 3.12 --group research
      - run: uv run ruff check src tests experiments
      - run: uv run ruff format --check src tests experiments
      - run: uv run --group research pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for the AWS push role
    env:
      # Stays inert until the aws-infra demo-server stack is applied and these
      # repository secrets are set, so the first pushes only run tests.
      READY: ${{ secrets.AWS_IMAGE_PUSH_ROLE_ARN != '' && secrets.ECR_REPOSITORY != '' }}
    steps:
      - uses: actions/checkout@v7

      # The role and registry are secrets so the logs show neither. The account
      # ID also appears on its own (registry host, push output); mask it too.
      - if: env.READY == 'true'
        env:
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: echo "::add-mask::${REPOSITORY%%.*}"

      - if: env.READY == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IMAGE_PUSH_ROLE_ARN }}
          aws-region: eu-central-1

      - if: env.READY == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      # Tagged by commit so a tag always identifies the source it was built from.
      # The digest is what deployment pins; the tag is only for humans.
      - name: Build and push the image
        if: env.READY == 'true'
        env:
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          image="$REPOSITORY:${{ github.sha }}"
          docker build -t "$image" .
          docker push "$image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
          digest=${digest#*@}
          echo "Pushed $digest"
          {
            echo "### Image published"
            echo
            echo '```'
            echo "$digest"
            echo '```'
            echo
            echo "Deploy it on the host with: bash deploy/install-server.sh $digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - if: env.READY != 'true'
        run: echo "ECR secrets are not set yet; skipping the image build."
